name: CI Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Security Hygiene Check
        run: |
          if git ls-files | grep -E '(^|/)\.private-signing(/|$)|(^|/)signing\.properties$|\.(keystore|p12)$'; then
            echo "::error::Sensitive signing material must not be tracked in git."
            exit 1
          fi
          extra_jks=$(git ls-files '*.jks' | grep -vx 'app/keystore/androidkey.jks' || true)
          if [ -n "$extra_jks" ]; then
            echo "::error::Unexpected keystore tracked: $extra_jks"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Release Kotlin & Run Unit Tests
        run: ./gradlew :app:compileDefaultReleaseKotlin :app:testDefaultDebugUnitTest --no-daemon --console=plain
